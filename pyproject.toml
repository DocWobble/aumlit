[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reshell"
version = "0.1.0"
description = "Tiny probing CLI for model artifacts"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{name = "Aumlit Contributors"}]
dependencies = [
    "onnx",
    "onnxruntime",
    "numpy",
    "gguf",
    "PyYAML",
    "filelock",
]

[project.scripts]
reshell = "reshell:main"

[tool.setuptools]
py-modules = [
    "classifier",
    "reshell",
    "headers",
    "printers",
    "planner",
    "puppets",
    "sandbox",
]
